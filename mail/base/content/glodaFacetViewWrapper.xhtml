<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="window"
>
  <head>
    <title></title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; script-src chrome: 'unsafe-inline' moz-src:; style-src chrome: 'unsafe-inline'"
    />
    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        margin: 0;
      }
    </style>
    <link rel="localization" href="branding/brand.ftl" />
    <script
      defer="defer"
      src="chrome://messenger/content/viewZoomOverlay.js"
    ></script>
    <script>
      // <![CDATA[
      // Zoom used to apply to the whole search page, and Gecko remembers a
      // zoom level per site -- so a page zoomed by an earlier build stays
      // zoomed. Enlarging only the message inside a page that is still at
      // 130% leaves the preview laid out against the wrong size, which is
      // how the message ends up clipped or off-screen. The page is pinned at
      // 100% and only the message is ever scaled.
      window.addEventListener("load", () => {
        const outer = document.getElementById("browser");
        if (outer) {
          outer.fullZoom = 1;
          outer.textZoom = 1;
        }
      });

      // Zoom here scales text only, and steps through fixed levels.
      //
      // Full zoom scales the layout as well as the type, and the preview is
      // narrow: an HTML message built on a fixed-width table becomes wider
      // than the pane, and its text is pushed out of sight rather than made
      // bigger -- which looks like the message vanishing, and in the dark
      // theme leaves nothing but empty background. Text zoom leaves widths
      // alone, so the message stays where it is and only the type grows,
      // which is the actual intent of enlarging a message.
      const MESSAGE_ZOOM_STEPS = [
        0.5, 0.67, 0.8, 0.9, 1, 1.1, 1.2, 1.33, 1.5, 1.7, 2, 2.4, 3,
      ];

      function messageZoomStep(direction) {
        const browser = getBrowser();
        if (!browser) {
          return;
        }
        // Any full zoom left on this browser -- by an earlier build, or by
        // the message pane elsewhere -- would keep the layout inflated
        // underneath the text zoom, so clear it.
        if (browser.fullZoom !== 1) {
          browser.fullZoom = 1;
        }
        const current = browser.textZoom || 1;
        let index = MESSAGE_ZOOM_STEPS.findIndex(
          step => Math.abs(step - current) < 0.01
        );
        if (index == -1) {
          // Landed between steps: start from the nearest one.
          index = MESSAGE_ZOOM_STEPS.reduce(
            (best, step, i) =>
              Math.abs(step - current) < Math.abs(MESSAGE_ZOOM_STEPS[best] - current)
                ? i
                : best,
            0
          );
        }
        const next = Math.min(
          Math.max(index + direction, 0),
          MESSAGE_ZOOM_STEPS.length - 1
        );
        browser.textZoom = MESSAGE_ZOOM_STEPS[next];
      }

      function messageZoomReset() {
        const browser = getBrowser();
        if (browser) {
          browser.textZoom = 1;
          browser.fullZoom = 1;
        }
      }

      function getBrowser() {
        const outer = document.getElementById("browser");
        // Every zoom command comes through here, so this is also where a
        // page left inflated gets put back. The load handler alone is not
        // enough: it does not run when the inner page reloads, and a stored
        // zoom can be restored after it has already run.
        if (outer && (outer.fullZoom !== 1 || outer.textZoom !== 1)) {
          outer.fullZoom = 1;
          outer.textZoom = 1;
        }
        // Zoom acts on whatever this returns. Once the preview is open the
        // thing being read is the message inside it, not the facets and
        // timeline around it, so zooming the whole page scales the search
        // furniture along with the text the reader is actually trying to
        // enlarge. The preview is its own browser, so it can be zoomed on
        // its own.
        const preview = outer?.contentDocument?.getElementById(
          "facetMessageBrowser"
        );
        // The preview is an about:message, which puts the message body in a
        // browser of its own and arranges the header, buttons and attachment
        // list around it. Zooming the whole thing scales that furniture along
        // with the text. This is the browser the message pane's own zoom
        // commands act on, so it behaves the same here.
        const body = preview?.contentWindow?.getMessagePaneBrowser?.();
        if (body) {
          return body;
        }
        // With no message to scale, zoom has nothing to do -- returning the
        // page would scale the facets and timeline, which is the behaviour
        // being removed. The hidden preview browser absorbs it harmlessly.
        return preview || outer;
      }
      // ]]>
    </script>
  </head>
  <html:body
    xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  >
    <commandset id="selectEditMenuItems">
      <command id="cmd_fullZoomReduce" oncommand="messageZoomStep(-1)" />
      <command id="cmd_fullZoomEnlarge" oncommand="messageZoomStep(1)" />
      <command id="cmd_fullZoomReset" oncommand="messageZoomReset()" />
    </commandset>
    <keyset>
      <!--move to locale-->
      <key
        id="key_fullZoomEnlarge"
        key="+"
        command="cmd_fullZoomEnlarge"
        modifiers="accel"
      />
      <key
        id="key_fullZoomEnlarge2"
        key="="
        command="cmd_fullZoomEnlarge"
        modifiers="accel"
      />
      <key
        id="key_fullZoomReduce"
        key="-"
        command="cmd_fullZoomReduce"
        modifiers="accel"
      />
      <key
        id="key_fullZoomReset"
        key="0"
        command="cmd_fullZoomReset"
        modifiers="accel"
      />
    </keyset>
    <tooltip id="aHTMLTooltip" page="true" />
    <browser
      id="browser"
      flex="1"
      disablehistory="true"
      tooltip="aHTMLTooltip"
    />
  </html:body>
</html>
