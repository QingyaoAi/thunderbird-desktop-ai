   -
   - The AI pane: the fourth pane of the mail tab, after the message pane.
   - Its splitter lives alongside the other pane splitters in
   - about3Pane.xhtml; visibility is driven by that splitter, the same way
   - the folder and message panes work.  -->

<div id="aiPane" class="ai-panel" hidden="hidden">

  <div class="ai-panel-header">
    <h2 class="ai-panel-title" data-l10n-id="ai-panel-title"></h2>
    <button id="ai-panel-key"
            class="ai-panel-icon-button"
            type="button"
            data-l10n-id="ai-panel-key-button"></button>
    <button id="ai-panel-clear"
            class="ai-panel-icon-button"
            type="button"
            data-l10n-id="ai-panel-clear-button"></button>
    <button id="ai-panel-close"
            class="ai-panel-icon-button"
            type="button"
            data-l10n-id="ai-panel-close-button"></button>
  </div>

  <!-- Shown instead of the conversation until a provider and key exist,
     - so it is obvious nothing is being sent anywhere yet. -->
  <div id="ai-panel-setup" class="ai-panel-setup" hidden="hidden">
    <p data-l10n-id="ai-panel-not-configured"></p>
    <p class="ai-panel-setup-detail" data-l10n-id="ai-panel-setup-hint"></p>
    <button id="ai-panel-setup-key"
            class="ai-panel-send"
            type="button"
            data-l10n-id="ai-panel-setup-key-button"></button>
  </div>

  <div id="ai-panel-transcript"
       class="ai-panel-transcript"
       role="log"
       aria-live="polite"></div>

  <div id="ai-panel-actions" class="ai-panel-actions">
    <button id="ai-panel-draft-reply"
            class="ai-panel-action"
            type="button"
            disabled="disabled"
            data-l10n-id="ai-panel-draft-reply"></button>
  </div>

  <form id="ai-panel-composer" class="ai-panel-composer">
    <textarea id="ai-panel-input"
              class="ai-panel-input"
              rows="2"
              data-l10n-id="ai-panel-input"></textarea>
    <button id="ai-panel-send"
            class="ai-panel-send"
            type="submit"
            data-l10n-id="ai-panel-send-button"></button>
    <button id="ai-panel-stop"
            class="ai-panel-send ai-panel-stop"
            type="button"
            hidden="hidden"
            data-l10n-id="ai-panel-stop-button"></button>
  </form>

</div>
