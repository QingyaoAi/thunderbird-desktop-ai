   -
   - The AI pane: the fourth pane of the mail tab, after the message pane.
   - Its splitter lives alongside the other pane splitters in
   - about3Pane.xhtml; visibility is driven by that splitter, the same way
   - the folder and message panes work.  -->

<div id="aiPane" class="ai-panel" hidden="hidden">

  <div class="ai-panel-header">
    <h2 class="ai-panel-title" data-l10n-id="ai-panel-title"></h2>
    <!-- Which conversation this is, and the way to the earlier ones. -->
    <button id="ai-panel-history"
            class="ai-panel-history-button"
            type="button"
            aria-expanded="false"
            aria-controls="ai-panel-history-list"
            data-l10n-id="ai-panel-history-button">
      <span id="ai-panel-conversation-new"
            class="ai-panel-conversation-title"
            data-l10n-id="ai-panel-conversation-new"></span>
      <span id="ai-panel-conversation-title"
            class="ai-panel-conversation-title"
            hidden="hidden"></span>
      <!-- While dsh answers in another conversation, out of sight. -->
      <span id="ai-panel-out-of-sight"
            class="ai-panel-out-of-sight"
            role="img"
            hidden="hidden"></span>
    </button>
    <button id="ai-panel-new"
            class="ai-panel-icon-button"
            type="button"
            data-l10n-id="ai-panel-new-button"></button>
    <!-- Starts and stops DeepSeek Harness; see ai-panel-dsh.mjs. -->
    <button id="ai-panel-dsh"
            class="ai-panel-dsh-toggle"
            type="button"
            aria-pressed="false"
            data-l10n-id="ai-panel-dsh-button"></button>
    <button id="ai-panel-dsh-settings"
            class="ai-panel-icon-button"
            type="button"
            data-l10n-id="ai-panel-dsh-settings-button"></button>
    <button id="ai-panel-close"
            class="ai-panel-icon-button"
            type="button"
            data-l10n-id="ai-panel-close-button"></button>
  </div>

  <!-- The earlier conversations, shown in place of the one open while the
     - header's title is pressed. -->
  <div id="ai-panel-history-list" class="ai-panel-history" hidden="hidden">
    <h3 class="ai-panel-history-heading"
        data-l10n-id="ai-panel-history-heading"></h3>
    <ul id="ai-panel-history-items" class="ai-panel-history-items"></ul>
    <p id="ai-panel-history-empty"
       class="ai-panel-history-empty"
       hidden="hidden"
       data-l10n-id="ai-panel-history-empty"></p>
  </div>

  <!-- Shown instead of the conversation until a provider and key exist,
     - so it is obvious nothing is being sent anywhere yet. -->
  <div id="ai-panel-setup" class="ai-panel-setup" hidden="hidden">
    <p data-l10n-id="ai-panel-not-configured"></p>
    <p class="ai-panel-setup-detail" data-l10n-id="ai-panel-setup-hint"></p>
    <button id="ai-panel-setup-key"
            class="ai-panel-send"
            type="button"
            data-l10n-id="ai-panel-setup-key-button"></button>
  </div>

  <div id="ai-panel-transcript"
       class="ai-panel-transcript"
       role="log"
       aria-live="polite"></div>

  <form id="ai-panel-composer" class="ai-panel-composer">
    <textarea id="ai-panel-input"
              class="ai-panel-input"
              rows="2"
              data-l10n-id="ai-panel-input"></textarea>
    <!-- Both actions sit beside the box they act on. The draft button used
       - to be in a row above it, which read as belonging to the transcript
       - while quietly consuming whatever was typed below. -->
    <div id="ai-panel-actions" class="ai-panel-actions">
      <button id="ai-panel-send"
              class="ai-panel-send"
              type="submit"
              data-l10n-id="ai-panel-send-button"></button>
      <button id="ai-panel-stop"
              class="ai-panel-send ai-panel-stop"
              type="button"
              hidden="hidden"
              data-l10n-id="ai-panel-stop-button"></button>
      <button id="ai-panel-draft-reply"
              class="ai-panel-action"
              type="button"
              disabled="disabled"
              data-l10n-id="ai-panel-draft-reply"></button>
    </div>
  </form>

  <!-- Which model answers, under the box it answers. Outside the form, which
     - is hidden until a model is set up: the picker is how to choose another
     - one that is. -->
  <div class="ai-panel-footer">
    <select id="ai-panel-model"
            class="ai-panel-model"
            data-l10n-id="ai-panel-model"></select>
    <!-- dsh's models, shown in place of the picker above while it is on. -->
    <select id="ai-panel-dsh-model"
            class="ai-panel-model"
            hidden="hidden"
            data-l10n-id="ai-panel-dsh-model"></select>
  </div>

</div>
