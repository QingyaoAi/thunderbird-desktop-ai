<splitter id="ai-panel-splitter"
          class="ai-panel-splitter"
          collapse="after"
          resizebefore="closest"
          state="collapsed"
          hidden="hidden"/>
<vbox id="ai-panel-box" hidden="hidden" persist="width" width="340">
  <html:div id="ai-panel" class="ai-panel">

    <html:div class="ai-panel-header">
      <html:h2 class="ai-panel-title" data-l10n-id="ai-panel-title"></html:h2>
      <html:button id="ai-panel-key"
                   class="ai-panel-icon-button"
                   type="button"
                   data-l10n-id="ai-panel-key-button"></html:button>
      <html:button id="ai-panel-clear"
                   class="ai-panel-icon-button"
                   type="button"
                   data-l10n-id="ai-panel-clear-button"></html:button>
      <html:button id="ai-panel-close"
                   class="ai-panel-icon-button"
                   type="button"
                   data-l10n-id="ai-panel-close-button"></html:button>
    </html:div>

    <!-- Shown instead of the conversation until a provider and key exist,
       - so it is obvious nothing is being sent anywhere yet. -->
    <html:div id="ai-panel-setup" class="ai-panel-setup" hidden="hidden">
      <html:p data-l10n-id="ai-panel-not-configured"></html:p>
      <html:p class="ai-panel-setup-detail" data-l10n-id="ai-panel-setup-hint"></html:p>
    </html:div>

    <html:div id="ai-panel-transcript"
              class="ai-panel-transcript"
              role="log"
              aria-live="polite"></html:div>

    <html:div id="ai-panel-actions" class="ai-panel-actions">
      <html:button id="ai-panel-draft-reply"
                   class="ai-panel-action"
                   type="button"
                   disabled="disabled"
                   data-l10n-id="ai-panel-draft-reply"></html:button>
    </html:div>

    <html:form id="ai-panel-composer" class="ai-panel-composer">
      <html:textarea id="ai-panel-input"
                     class="ai-panel-input"
                     rows="2"
                     data-l10n-id="ai-panel-input"></html:textarea>
      <html:button id="ai-panel-send"
                   class="ai-panel-send"
                   type="submit"
                   data-l10n-id="ai-panel-send-button"></html:button>
      <html:button id="ai-panel-stop"
                   class="ai-panel-send ai-panel-stop"
                   type="button"
                   hidden="hidden"
                   data-l10n-id="ai-panel-stop-button"></html:button>
    </html:form>

  </html:div>
</vbox>
